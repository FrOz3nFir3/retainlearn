name: Tests

# Runs on every pull request: the server's API tests, the client's type check, unit tests and build, the shared study
# rules' type check and tests, and a build and start of the server's Docker image. A merge to main deploys production (deploy.yml) with no
# tests of its own, so this is the gate: protect `main` and require all four checks ("api", "client", "core" and
# "image") to pass before merging.
on:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The Node that production runs (the Dockerfile's).
          node-version: 26
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            packages/core/package-lock.json
      # The shared rules' own dependencies (Zod) first: the server links to them (file:../packages/core).
      - run: npm ci --omit=dev --prefix ../packages/core
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            packages/core/package-lock.json
      # Installed and built exactly as Cloudflare builds the site: `npm ci`, then `npm run build`, whose prebuild script
      # installs the shared rules' own packages (Zod), since the client links to them (file:../packages/core). So a
      # change that would break the site's build fails here first. The type check and tests come after, once the
      # shared rules' packages are there.
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The Node that production runs (the Dockerfile's). It runs the .ts files directly, stripping their types.
          node-version: 26
          cache: npm
          cache-dependency-path: packages/core/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # Built as Dokploy builds it: the root Dockerfile, with the whole repo as its context.
      - run: docker build -t retainlearn-api .
      # Started as Dokploy starts it, with its settings as environment variables, on this job's database. Then: it
      # answers, its migrations run, a public page works, the cleanup job runs inside it, and it stops at once when
      # asked. Requests behind Cloudflare and Dokploy's proxy arrive marked as HTTPS; plain HTTP is redirected.
      - name: Start the image and check it
        run: |
          docker run -d --name api --network host \
            -e MONGO_URI=mongodb://localhost:27017/retainlearn_image \
            -e REDIS_URI=redis://localhost:6379/2 \
            -e ACCESS_TOKEN_SECRET=ci-only -e REFRESH_TOKEN_SECRET=ci-only -e COOKIE_SECRET=ci-only \
            retainlearn-api
          health() { curl -fsS -H "X-Forwarded-Proto: https" http://localhost:3000/api/health; }
          for i in $(seq 1 30); do health | grep -q '"state":"done"' && break; sleep 2; done
          health | tee health.json
          echo
          grep -q '"status":"ok"' health.json
          grep -q '"state":"done"' health.json
          curl -fsS -o /dev/null -H "X-Forwarded-Proto: https" "http://localhost:3000/api/subjects?page=1"
          docker exec api node --version
          # The shared rules (TypeScript, run by Node directly) and Zod load in the image.
          docker exec api node --input-type=module -e 'const core = await import("@retainlearn/core"); if (typeof core.planDay !== "function" || !core.TimeZone.safeParse("Asia/Kolkata").success) process.exit(1); console.log("The shared rules load in the image");'
          docker exec api npm run cron:cleanup
          start=$(date +%s); docker stop api; test $(( $(date +%s) - start )) -lt 5
      - name: The server's log
        if: always()
        run: docker logs api || true
